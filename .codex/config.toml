# Generated by tools/ai/sync-config.ps1; edit config/ai/agent-policy.json.
# Project defaults; explicit session settings may override these values.
model = "gpt-6-astra"
model_reasoning_effort = "medium"
model_verbosity = "medium"
tool_output_token_limit = 4000

# The concurrency limit counts subagents only; add one for the coordinator.
[agents]
enabled = true
max_concurrent_threads_per_session = 7
default_subagent_model = "gpt-5.3-codex-spark"
default_subagent_reasoning_effort = "medium"
