{
  "name": "Repository checks",
  "on": {
    "push": {
      "branches": [
        "main",
        "bootstrap/**",
        "work/**",
        "codex/**"
      ]
    },
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "repository-checks": {
      "name": "Repository policy and Python baseline",
      "runs-on": "${{ matrix.os }}",
      "strategy": {
        "matrix": {
          "os": [
            "ubuntu-latest",
            "windows-latest"
          ]
        }
      },
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12.10"
          }
        },
        {
          "name": "Policy, documentation, schemas and Python checks",
          "run": "python tools/ci/check.py --baseline"
        },
        {
          "name": "Windows setup regression checks (no downloads or installs)",
          "if": "runner.os == 'Windows'",
          "shell": "powershell",
          "run": "./tools/setup/test_setup.ps1 -PythonExecutable (Get-Command python).Source"
        }
      ]
    }
  }
}
