<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <title>Participant cue badges: Listen, Your turn, Hold still, Tell the operator, Watch, Please wait, Rest</title>
  <rect width="1200" height="150" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <g font-size="14" font-weight="700" letter-spacing="1.5" text-anchor="middle">
    <rect x="30" y="30" width="130" height="40" rx="20" fill="#222b33" stroke="#4b5d6b" stroke-width="2"/><text x="95" y="56" fill="#d5dde3">LISTEN</text>
    <rect x="176" y="30" width="148" height="40" rx="20" fill="#1f3229" stroke="#9bc8b1" stroke-width="2"/><text x="250" y="56" fill="#d4eee0">YOUR TURN</text>
    <rect x="340" y="30" width="148" height="40" rx="20" fill="#1f3229" stroke="#9bc8b1" stroke-width="2"/><text x="414" y="56" fill="#d4eee0">HOLD STILL</text>
    <rect x="504" y="30" width="214" height="40" rx="20" fill="#21303b" stroke="#96b3c9" stroke-width="2"/><text x="611" y="56" fill="#dbe8f1">TELL THE OPERATOR</text>
    <rect x="734" y="30" width="130" height="40" rx="20" fill="#21303b" stroke="#96b3c9" stroke-width="2"/><text x="799" y="56" fill="#dbe8f1">WATCH</text>
    <rect x="880" y="30" width="160" height="40" rx="20" fill="#222b33" stroke="#4b5d6b" stroke-width="2"/><text x="960" y="56" fill="#d5dde3">PLEASE WAIT</text>
    <rect x="1056" y="30" width="114" height="40" rx="20" fill="#1f2e30" stroke="#7fa9ad" stroke-width="2"/><text x="1113" y="56" fill="#d5e6e7">REST</text>
  </g>
  <g font-size="13" fill="#9aa6b2" text-anchor="middle">
    <text x="95" y="98">Narration playing</text><text x="95" y="116">nothing counts yet</text>
    <text x="250" y="98">Aim, fire, reload,</text><text x="250" y="116">hold the replica…</text>
    <text x="414" y="98">Calibration:</text><text x="414" y="116">look at the dot</text>
    <text x="611" y="98">Say when you are ready</text><text x="611" y="116">or have a question</text>
    <text x="799" y="98">ELTS below</text><text x="799" y="116">the screen</text>
    <text x="960" y="98">Operator is fitting,</text><text x="960" y="116">checking or saving</text>
    <text x="1113" y="98">Break</text><text x="1113" y="116">countdown</text>
  </g>
</svg>
