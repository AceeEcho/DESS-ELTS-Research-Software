<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <title>Quick start: download the ZIP, extract it, then double-click START-ELTS.cmd (the first start also sets the computer up)</title>
  <rect width="1200" height="250" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <g fill="none" stroke="#96b3c9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- connectors -->
    <path d="M356 112h56M756 112h56" stroke="#536879"/>
    <path d="M402 104l10 8-10 8M802 104l10 8-10 8" stroke="#536879"/>
    <!-- 1 download: tray + arrow -->
    <path d="M200 70v44M184 98l16 16 16-16M176 126h48"/>
    <!-- 2 extract: folder -->
    <path d="M570 84h20l8 8h34v38h-62z"/><path d="M586 96v-22h18" stroke="#9bc8b1"/>
    <!-- 3 start: play -->
    <path d="M985 82l30 22-30 22z" fill="#9bc8b1" stroke="#9bc8b1"/>
  </g>
  <g text-anchor="middle">
    <g font-size="15" font-weight="700" fill="#96b3c9" letter-spacing="2">
      <text x="200" y="44">STEP 1</text><text x="600" y="44">STEP 2</text><text x="1000" y="44">STEP 3 · EVERY TIME</text>
    </g>
    <g font-size="22" font-weight="700" fill="#e6edf3">
      <text x="200" y="168">Download ZIP</text><text x="600" y="168">Extract it</text><text x="1000" y="168">START-ELTS.cmd</text>
    </g>
    <g font-size="15" fill="#9aa6b2">
      <text x="200" y="196">Green Code button</text><text x="200" y="216">→ Download ZIP</text>
      <text x="600" y="196">To a local folder, not OneDrive</text><text x="600" y="216">Don't run from inside the ZIP</text>
      <text x="1000" y="196">Opens the dashboard and participant window</text><text x="1000" y="216">First start also installs everything</text>
    </g>
  </g>
</svg>
