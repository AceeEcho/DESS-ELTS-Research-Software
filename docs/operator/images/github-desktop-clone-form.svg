<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">GitHub Desktop clone form illustration</title><desc id="d">A labelled mock interface showing the URL tab, repository URL, local path, and Clone button. It is an illustration, not a screenshot.</desc><rect width="1000" height="360" fill="#f6f8fa"/><g font-family="Arial, sans-serif" fill="#24292f"><text x="40" y="42" font-size="24" font-weight="700">Illustration: Clone repository (mock interface)</text><rect x="70" y="75" width="860" height="225" rx="10" fill="white" stroke="#8b949e" stroke-width="2"/><text x="95" y="110" font-size="18" font-weight="700">Clone a Repository</text><text x="100" y="145" font-size="16" fill="#0969da">URL</text><text x="100" y="177" font-size="15">Repository URL</text><rect x="270" y="153" width="590" height="38" rx="5" fill="#f6f8fa" stroke="#2563eb" stroke-width="3"/><text x="285" y="178" font-size="15">https://github.com/AceeEcho/DESS-ELTS-Research-Software.git</text><text x="100" y="222" font-size="15">Local path</text><rect x="270" y="198" width="590" height="38" rx="5" fill="#f6f8fa" stroke="#2563eb" stroke-width="3"/><text x="285" y="223" font-size="15">C:\Users\YOUR-NAME\source\DESS-ELTS-Research-Software</text><rect x="770" y="255" width="90" height="32" rx="6" fill="#1f883d"/><text x="789" y="277" font-size="16" fill="white" font-weight="700">Clone</text><text x="100" y="270" font-size="14" fill="#57606a">Choose URL, local path, then clone.</text></g></svg>
