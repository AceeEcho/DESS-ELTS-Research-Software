<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="t d">
  <title id="t">Developer setup phases</title>
  <desc id="d">A five step labelled diagram showing prerequisites, pinned tools, local configuration, Unity import, and verification.</desc>
  <rect width="1100" height="300" fill="#f6f8fa"/>
  <g font-family="Arial, sans-serif" fill="#24292f">
    <text x="40" y="42" font-size="24" font-weight="700">Illustration: SETUP-DEV.cmd phases</text>
    <g font-size="15" text-anchor="middle">
      <rect x="35" y="105" width="180" height="85" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="125" y="140">1. Prerequisites</text>
      <text x="125" y="164">Git / internet</text>
      <rect x="245" y="105" width="180" height="85" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
      <text x="335" y="140">2. Pinned tools</text>
      <text x="335" y="160" font-size="14">Python / .NET</text>
      <text x="335" y="178" font-size="14">Node / Unity</text>
      <rect x="455" y="105" width="180" height="85" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="545" y="140">3. Local config</text>
      <text x="545" y="164">machine settings</text>
      <rect x="665" y="105" width="180" height="85" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="755" y="140">4. Unity import</text>
      <text x="755" y="164">project bootstrap</text>
      <rect x="875" y="105" width="180" height="85" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
      <text x="965" y="140">5. Verify</text>
      <text x="965" y="164">report result</text>
    </g>
    <path d="M215 147h25" stroke="#111827" stroke-width="3" marker-end="url(#a)"/>
    <path d="M425 147h25" stroke="#111827" stroke-width="3" marker-end="url(#a)"/>
    <path d="M635 147h25" stroke="#111827" stroke-width="3" marker-end="url(#a)"/>
    <path d="M845 147h25" stroke="#111827" stroke-width="3" marker-end="url(#a)"/>
    <defs>
      <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
        <path d="M0 0l8 3-8 3z" fill="#111827"/>
      </marker>
    </defs>
    <text x="310" y="245" font-size="16">Sign in or approve UAC when Windows or Unity requests it, then rerun setup.</text>
  </g>
</svg>
